[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esk-lab10-qdrant-demo"
version = "1.0.1"
description = "Synthetic multi-tenant Qdrant retrieval security demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
